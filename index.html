<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caisse Vesuvio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="service-midi">
  <header class="app-header">
    <h1>Caisse Vesuvio</h1>

    <nav class="service-switch" aria-label="Choix du service">
      <button
        type="button"
        id="service-midi-button"
        class="service-button is-active"
        data-service="midi"
      >
        Midi
      </button>

      <button
        type="button"
        id="service-soir-button"
        class="service-button"
        data-service="soir"
      >
        Soir
      </button>
    </nav>
  </header>

  <main class="app-main">
    <div id="app-pages" class="app-pages">
      <section
        id="midi-section"
        class="service-section"
        data-service="midi"
      ></section>

      <section
        id="soir-section"
        class="service-section is-hidden"
        data-service="soir"
      >
        <h2>Service Soir</h2>

        <nav
          id="soir-navigation"
          class="soir-navigation"
          aria-label="Pages du service Soir"
        ></nav>

        <div id="soir-pages" class="soir-pages"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
