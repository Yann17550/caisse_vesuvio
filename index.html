<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clôtures Vesuvio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/accueil.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/base.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageMidi.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageCB.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageEspeces.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageANCV.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageCheques.css" />
  <link rel="stylesheet" href="css/clotures-vesuvio/pageRecapitulatif.css" />
</head>
<body class="accueil-actif">
  <header class="app-header">
    <h1>Clôtures Vesuvio</h1>

    <nav
      id="service-switch"
      class="service-switch is-hidden"
      aria-label="Choix du service"
    >
      <button
        type="button"
        id="service-midi-button"
        class="service-button"
        data-service="midi"
      >
        Midi
      </button>

      <button
        type="button"
        id="service-soir-button"
        class="service-button"
        data-service="soir"
      >
        Soir
      </button>
    </nav>
  </header>

  <main class="app-main">
    <div id="app-pages" class="app-pages">

      <section
        id="accueil-section"
        class="accueil-section"
      >
        <h2>Accueil</h2>

        <div class="accueil-applications">
          <button
            type="button"
            id="accueil-bouton-clotures"
            class="accueil-bouton-application"
          >
            Clôtures
          </button>
        </div>

        <div
          id="accueil-choix-etablissement"
          class="accueil-choix-etablissement is-hidden"
        >
          <h3>Choisir l’établissement</h3>

          <div
            id="accueil-liste-etablissements"
            class="accueil-liste-etablissements"
          ></div>

          <button
            type="button"
            id="accueil-bouton-retour"
            class="accueil-bouton-retour"
          >
            Retour à l’accueil
          </button>
        </div>

        <div
          id="accueil-message"
          class="accueil-message is-hidden"
          role="status"
        ></div>
      </section>

      <section
        id="clotures-vesuvio-section"
        class="clotures-vesuvio-section is-hidden"
      >
        <div id="app-pages-clotures-vesuvio" class="app-pages">

          <section
            id="midi-section"
            class="service-section is-hidden"
            data-service="midi"
          ></section>

          <section
            id="soir-section"
            class="service-section is-hidden"
            data-service="soir"
          >
            <h2>Service</h2>

            <nav
              id="soir-navigation"
              class="soir-navigation"
              aria-label="Pages du service Soir"
            ></nav>

            <div id="soir-pages" class="soir-pages"></div>
          </section>

        </div>
      </section>

    </div>
  </main>

  <script type="module" src="clotures-vesuvio/demarrageCloturesVesuvio.js"></script>
</body>
</html>
