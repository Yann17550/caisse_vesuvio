<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sélection d’application</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="accueil-actif">
  <header class="app-header">
    <div class="header-ligne-permanente">
      <h1>Sélection d’application</h1>
      <button type="button" id="service-accueil-button"
        class="service-button is-hidden" data-service="accueil"
        aria-label="Retour à l’accueil" title="Accueil">Accueil</button>
    </div>
    <nav id="service-switch" class="service-switch is-hidden" aria-label="Choix du service">
      <button type="button" id="service-midi-button" class="service-button" data-service="midi">Midi</button>
      <button type="button" id="service-soir-button" class="service-button" data-service="soir">Soir</button>
    </nav>
    <p id="clotures-sous-titre" class="is-hidden" aria-live="polite"></p>
  </header>
  <main class="app-main">
    <div id="app-pages" class="app-pages">
      <section id="accueil-section" class="accueil-section">
        <div class="accueil-applications">
          <button type="button" id="accueil-bouton-clotures" class="accueil-bouton-application">Clôtures</button>
        </div>
        <div id="accueil-choix-etablissement" class="accueil-choix-etablissement is-hidden">
          <h3>Choisir l’établissement</h3>
          <div id="accueil-liste-etablissements" class="accueil-liste-etablissements"></div>
          <button type="button" id="accueil-bouton-retour" class="accueil-bouton-retour">Retour à l’accueil</button>
        </div>
        <div id="accueil-message" class="accueil-message is-hidden" role="status"></div>
      </section>
      <section id="clotures-vesuvio-section" class="clotures-vesuvio-section is-hidden">
        <div id="app-pages-clotures-vesuvio" class="app-pages">
          <section id="midi-section" class="service-section is-hidden" data-service="midi"></section>
          <section id="soir-section" class="service-section is-hidden" data-service="soir">
            <h2>Service</h2>
            <nav id="soir-navigation" class="soir-navigation" aria-label="Pages du service Soir"></nav>
            <div id="soir-pages" class="soir-pages"></div>
          </section>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="clotures-vesuvio/demarrageCloturesVesuvio.js"></script>
</body>
</html>
